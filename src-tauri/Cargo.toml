[package]
name = "geniusbar"
version = "0.1.51"
description = "GeniusBar's Tauri shell: tray item, popup window, platform calls (ADR-0004)"
edition = "2021"
publish = false

[lib]
name = "geniusbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent team-card windows on the desktop (#223).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

# `--snapshot` (#6) captures the popup's WKWebView; the versions are the
# ones wry already builds.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }

# The macOS 27 strip tool corrupts proc-macro dylibs ("mis-aligned LINKEDIT
# string pool"), so release builds fail locally. Build-time artifacts never
# ship, so leaving them unstripped costs nothing.
[profile.release.build-override]
strip = false
